appId: com.kongyo2.cc-container-desktop
productName: CC Container Desktop
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# The Dockerfile and post-create script must stay outside the asar: the app
# copies them into userData on first run, and asar paths are not real files.
extraResources:
  - from: docker
    to: docker
    filter:
      - '**/*'

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CC Container Desktop

linux:
  target:
    - AppImage
  category: Development
  icon: build/icon.png
  # Without this the window manager cannot tie a running window to the .desktop
  # entry, so the app shows a generic icon in the dock.
  syncDesktopName: true
