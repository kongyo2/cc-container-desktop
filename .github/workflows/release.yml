name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.5.0. Leave empty to use the one in package.json.'
        required: false
        type: string
      draft:
        description: 'Create the release as a draft, so you can review it before publishing.'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark the release as a pre-release.'
        required: false
        default: false
        type: boolean
      linux:
        description: 'Also attach a Linux AppImage.'
        required: false
        default: false
        type: boolean
      require_published_catalog:
        description: 'Refuse to release unless every catalog digest resolves anonymously on Docker Hub.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Catalog gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify the bundled catalog against Docker Hub
        run: |
          if [ "${{ inputs.require_published_catalog }}" = "true" ]; then
            npm run catalog:verify:online
          else
            npm run catalog:verify
            echo "::warning::releasing without confirming the catalog digests on Docker Hub"
          fi

  windows:
    name: Windows installer
    needs: gate
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve the version
        id: version
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            VERSION="${REQUESTED#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Stamp the version
        shell: bash
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --win --x64 --publish never

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la release

          RELEASE_LINE="$(node -p "require('./src/shared/imageCatalog.json').entries[0].release")"
          REPO_LINE="$(node -p "require('./src/shared/imageCatalog.json').repository")"

          NOTES_FILE="$(mktemp)"
          {
            echo "## Claude Code Container Workbench $VERSION"
            echo
            echo "Windows 11 用インストーラです。Docker Desktop (Linux コンテナ) が必要です。"
            echo "A Windows 11 installer. Docker Desktop (Linux containers) is required."
            echo
            echo "### 使い方 / Getting started"
            echo
            echo '1. 下の `.exe` をダウンロードして実行 / download and run the `.exe` below'
            echo '2. Docker Desktop を起動 / start Docker Desktop'
            echo '3. アプリの「イメージ」で用途に合うイメージを「ダウンロードして登録」 / on the Images page, "Download and register" the variant you need'
            echo '4. 「環境」でそのイメージを選んだ環境を作り、「+」でタスクを作成 / create an environment that uses it, then a task with "+"'
            echo
            echo "同梱カタログ / bundled catalog: \`${REPO_LINE}\` release \`${RELEASE_LINE}\`"
            echo
            echo "詳細は [README](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/README.md) を参照してください."
          } > "$NOTES_FILE"

          ARGS=(--title "$VERSION" --notes-file "$NOTES_FILE" --target "$GITHUB_SHA")
          if [ "${{ inputs.draft }}" = "true" ]; then ARGS+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi

          gh release create "$TAG" "${ARGS[@]}" release/*.exe
          echo "Created $TAG"

  linux:
    name: Linux AppImage
    needs: windows
    if: inputs.linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp the version
        run: npm version "${{ needs.windows.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npm run build

      - name: Package
        run: npx electron-builder --linux AppImage --publish never

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.windows.outputs.tag }}
        run: gh release upload "$TAG" release/*.AppImage --clobber
