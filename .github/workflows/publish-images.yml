name: Publish images

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Image release, YYYY.MM.N (e.g. 2026.09.1). Official tags are never reused.'
        required: true
        type: string
      variants:
        description: 'Comma-separated variants to build'
        required: false
        default: 'base,web,python,go,rust,jvm,ruby,full'
        type: string
      platforms:
        description: 'Comma-separated platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      promote:
        description: 'Promote the candidates to the official tags'
        required: false
        default: true
        type: boolean
      open_pr:
        description: 'Open a pull request that adopts the generated catalog'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-images-${{ inputs.release }}
  cancel-in-progress: false

env:
  REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || secrets.DOCKERHUB_REPOSITORY || 'docker.io/kongyo2/cc-workbench' }}
  REPOSITORY_SOURCE: ${{ vars.DOCKERHUB_REPOSITORY && 'variable' || secrets.DOCKERHUB_REPOSITORY && 'secret' || 'default' }}
  CANDIDATE_PREFIX: candidate-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prepare:
    name: Validate inputs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      variants: ${{ steps.plan.outputs.variants }}
      platforms: ${{ steps.plan.outputs.platforms }}
      revision: ${{ steps.plan.outputs.revision }}
      built_at: ${{ steps.plan.outputs.built_at }}
    steps:
      - name: Resolve the target repository
        run: |
          set -euo pipefail
          echo "publishing to $REPOSITORY (DOCKERHUB_REPOSITORY source: $REPOSITORY_SOURCE)"
          case "$REPOSITORY_SOURCE" in
            secret)
              echo "::notice::DOCKERHUB_REPOSITORY is a secret, so it reads as *** in these logs; move it to the repository variables to keep it legible"
              ;;
            default)
              echo "::notice::no DOCKERHUB_REPOSITORY variable or secret is set; publishing at the built-in default"
              ;;
          esac
          if [[ ! "$REPOSITORY" =~ ^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+){2,}$ ]]; then
            echo "::error::DOCKERHUB_REPOSITORY must be lowercase, host-qualified and untagged, like docker.io/namespace/name"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the lock and the catalog scripts
        run: |
          node --experimental-strip-types scripts/verify-image-catalog.mjs
          jq -e '.schemaVersion == 1' docker/image-versions.lock.json >/dev/null

      - name: Plan the build matrix
        id: plan
        env:
          RELEASE: ${{ inputs.release }}
          VARIANTS: ${{ inputs.variants }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]{1,3}$ ]]; then
            echo "::error::release must look like YYYY.MM.N, got '$RELEASE'"
            exit 1
          fi
          matrix="$(jq -cn --arg variants "$VARIANTS" --arg platforms "$PLATFORMS" '
            {
              include: [
                ($variants | split(",") | map(gsub("\\s"; "")) | .[] | select(length > 0)) as $variant |
                ($platforms | split(",") | map(gsub("\\s"; "")) | .[] | select(length > 0)) as $platform |
                {
                  variant: $variant,
                  platform: $platform,
                  arch: ($platform | split("/")[1]),
                  runner: (if $platform == "linux/arm64" then "ubuntu-24.04-arm" else "ubuntu-24.04" end)
                }
              ]
            }')"
          for variant in $(jq -r '.include[].variant' <<< "$matrix" | sort -u); do
            case "$variant" in base|web|python|go|rust|jvm|ruby|full) ;; *) echo "::error::unknown variant $variant"; exit 1 ;; esac
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "variants=$(jq -c '[.include[].variant] | unique' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "platforms=$(jq -c '[.include[].platform] | unique' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Refuse to reuse an official tag
        env:
          RELEASE: ${{ inputs.release }}
          VARIANTS: ${{ steps.plan.outputs.variants }}
        run: |
          set -euo pipefail
          for variant in $(jq -r '.[]' <<< "$VARIANTS"); do
            tag="$REPOSITORY:$variant-$RELEASE"
            if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
              echo "::error::$tag already exists; official tags are immutable, choose a new release"
              exit 1
            fi
          done

  build:
    name: Build ${{ matrix.variant }} (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          build-args: |
            IMAGE_RELEASE=${{ inputs.release }}
            SOURCE_REVISION=${{ needs.prepare.outputs.revision }}
            BUILT_AT=${{ needs.prepare.outputs.built_at }}
          outputs: type=image,"name=${{ env.REPOSITORY }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.REPOSITORY }}:cache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REPOSITORY }}:cache-${{ matrix.variant }}-${{ matrix.arch }},mode=max

      - name: Record the digest
        run: |
          mkdir -p digests
          printf '%s\n' "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.variant }}-${{ matrix.arch }}"
          cat "digests/${{ matrix.variant }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge ${{ matrix.variant }} into a candidate index
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the candidate index and record its platform manifests
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          candidate="$REPOSITORY:$CANDIDATE_PREFIX-$VARIANT"
          refs=()
          for file in digests/*; do refs+=("$REPOSITORY@$(cat "$file")"); done
          docker buildx imagetools create -t "$candidate" "${refs[@]}"
          index_digest="$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')"
          raw="$(docker buildx imagetools inspect "$candidate" --raw)"
          mkdir -p out
          jq -n --arg index "$index_digest" '{indexDigest: $index, platforms: {}}' > "out/$VARIANT.json"
          for manifest in $(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture != "unknown") | "\(.platform.os)/\(.platform.architecture)=\(.digest)"' <<< "$raw"); do
            platform="${manifest%%=*}"
            digest="${manifest#*=}"
            bytes="$(docker buildx imagetools inspect "$REPOSITORY@$digest" --raw | jq '[.layers[].size] | add')"
            jq --arg platform "$platform" --arg digest "$digest" --argjson bytes "$bytes" \
              '.platforms[$platform] = {digest: $digest, compressedLayerBytes: $bytes}' "out/$VARIANT.json" > out/tmp.json
            mv out/tmp.json "out/$VARIANT.json"
          done
          cat "out/$VARIANT.json"

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.variant }}
          path: out/${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 7

  inspect:
    name: Read back ${{ matrix.variant }} (${{ matrix.platform }}) from the registry
    needs: [prepare, merge]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifest-${{ matrix.variant }}
          path: manifests

      - name: Pull the platform manifest and read its image-info
        env:
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          digest="$(jq -r --arg platform "$PLATFORM" '.platforms[$platform].digest' "manifests/$VARIANT.json")"
          test "$digest" != "null"
          image="$REPOSITORY@$digest"
          docker pull --platform "$PLATFORM" "$image"
          mkdir -p image-info
          docker run --rm "$image" cat /opt/cc/image-info.json > "image-info/$VARIANT.image-info.json"
          jq -e --arg variant "$VARIANT" --arg release "$RELEASE" '.variant == $variant and .release == $release' \
            "image-info/$VARIANT.image-info.json" >/dev/null

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux/amd64'
        with:
          name: image-info-${{ matrix.variant }}
          path: image-info/*.image-info.json
          if-no-files-found: error
          retention-days: 7

  promote:
    name: Promote to official tags
    needs: [prepare, inspect]
    if: inputs.promote
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the candidate indexes
        env:
          RELEASE: ${{ inputs.release }}
          VARIANTS: ${{ needs.prepare.outputs.variants }}
        run: |
          set -euo pipefail
          for variant in $(jq -r '.[]' <<< "$VARIANTS"); do
            candidate="$REPOSITORY:$CANDIDATE_PREFIX-$variant"
            official="$REPOSITORY:$variant-$RELEASE"
            expected="$(jq -r '.indexDigest' "manifests/$variant.json")"
            if docker buildx imagetools inspect "$official" >/dev/null 2>&1; then
              actual="$(docker buildx imagetools inspect "$official" --format '{{.Manifest.Digest}}')"
              if [ "$actual" != "$expected" ]; then
                echo "::error::$official already exists with $actual, expected $expected; stopping"
                exit 1
              fi
              echo "$official already points at the candidate index"
              continue
            fi
            docker buildx imagetools create -t "$official" "$candidate"
            actual="$(docker buildx imagetools inspect "$official" --format '{{.Manifest.Digest}}')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$official resolved to $actual after promotion, expected $expected"
              exit 1
            fi
            echo "promoted $official = $actual"
          done

      - name: Confirm anonymous pulls
        env:
          VARIANTS: ${{ needs.prepare.outputs.variants }}
        run: |
          set -euo pipefail
          docker logout docker.io
          for variant in $(jq -r '.[]' <<< "$VARIANTS"); do
            digest="$(jq -r '.platforms["linux/amd64"].digest // empty' "manifests/$variant.json")"
            if [ -z "$digest" ]; then continue; fi
            docker pull --platform linux/amd64 "$REPOSITORY@$digest" >/dev/null
            echo "anonymous pull ok: $variant $digest"
          done

      - uses: actions/checkout@v5

      - name: Docker Hub repository name
        id: hub
        run: |
          set -euo pipefail
          name="${REPOSITORY#docker.io/}"
          name="${name#index.docker.io/}"
          if [ "$name" = "$REPOSITORY" ]; then
            echo "hub=false" >> "$GITHUB_OUTPUT"
            echo "$REPOSITORY is not on Docker Hub; the description is left alone"
          else
            echo "hub=true" >> "$GITHUB_OUTPUT"
          fi
          echo "repository=$name" >> "$GITHUB_OUTPUT"

      - name: Update the Docker Hub description
        if: steps.hub.outputs.hub == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.hub.outputs.repository }}
          short-description: 'Claude Code runtime images for CC Container Desktop'
          readme-filepath: docker/README.dockerhub.md

  catalog:
    name: Generate the catalog
    needs: [prepare, inspect, promote]
    if: always() && needs.inspect.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: image-info-*
          path: image-info
          merge-multiple: true

      - name: Generate
        env:
          RELEASE: ${{ inputs.release }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          VARIANTS: ${{ needs.prepare.outputs.variants }}
          PROMOTED: ${{ needs.promote.result == 'success' }}
        run: |
          set -euo pipefail
          jq -s 'reduce .[] as $item ({}; . + $item)' <(for f in manifests/*.json; do jq --arg v "$(basename "$f" .json)" '{($v): .}' "$f"; done) > digests.json
          cat digests.json
          mkdir -p catalog-out
          node --experimental-strip-types scripts/generate-image-catalog.mjs \
            --repository "$REPOSITORY" --release "$RELEASE" --revision "$REVISION" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --digests digests.json --image-info-dir image-info \
            --variants "$(jq -r 'join(",")' <<< "$VARIANTS")" --merge src/shared/imageCatalog.json \
            --out catalog-out/imageCatalog.json
          if [ "$PROMOTED" = "true" ]; then
            node --experimental-strip-types scripts/verify-image-catalog.mjs --file catalog-out/imageCatalog.json --online --require-published
          else
            node --experimental-strip-types scripts/verify-image-catalog.mjs --file catalog-out/imageCatalog.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: image-catalog-${{ inputs.release }}
          path: catalog-out/imageCatalog.json
          if-no-files-found: error

      - name: Open a pull request that adopts the catalog
        if: inputs.open_pr && needs.promote.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.CATALOG_PR_TOKEN || github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          branch="catalog/$RELEASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          cp catalog-out/imageCatalog.json src/shared/imageCatalog.json
          npx prettier --write src/shared/imageCatalog.json >/dev/null
          git add src/shared/imageCatalog.json
          if git diff --cached --quiet; then
            echo "the catalog did not change"
            exit 0
          fi
          git commit -m "catalog: adopt image release $RELEASE"
          git push --force-with-lease origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "Adopt image release $RELEASE" \
            --body "Generated by the publish-images workflow (run ${{ github.run_id }}). Repository: $REPOSITORY. Every digest was pulled back from the registry on every platform, and anonymously after promotion." \
            || echo "pull request already exists"
