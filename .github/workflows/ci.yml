name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Oxlint
        run: npm run lint:strict

      - name: Knip
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck:ci

      - name: Typecheck dependencies
        run: npm run check:libs

      - name: Unit tests
        run: npm test

      - name: Catalog
        run: npm run catalog:verify

      - name: Build
        run: npm run build

  images:
    name: Image download flow
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build base and web
        run: |
          RELEASE=2026.09.1 REVISION="$GITHUB_SHA" BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            docker buildx bake -f docker/docker-bake.hcl small \
            --set 'base.tags=cc-workbench-ci:base-2026.09.1' --set 'web.tags=cc-workbench-ci:web-2026.09.1'

      - name: Install Electron's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libnss3 libasound2t64 libxss1 libnotify4 libsecret-1-0

      - name: Build the app
        run: npm run build

      - name: Download, register, environment, task (local registry)
        env:
          CC_E2E_BASE_IMAGE: cc-workbench-ci:base-2026.09.1
        run: xvfb-run -a node tests/e2e/images.mjs

  packaged:
    name: Packaged app smoke test
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Electron's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libnss3 libasound2t64 libxss1 libnotify4 libsecret-1-0

      - name: Build and package
        run: |
          npm run build
          npx electron-builder --dir --linux dir

      - name: Launch the packaged binary
        run: xvfb-run -a node tests/e2e/packaged.mjs release/linux-unpacked/cc-container-desktop

  windows-build:
    name: Build on Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Package (unpacked)
        run: npx electron-builder --dir --win dir

  e2e:
    name: End-to-end against a live endpoint
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Electron's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0t64 libnss3 libasound2t64 libxss1 libnotify4 libsecret-1-0

      - name: Check for a credential
        id: creds
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: echo "present=${{ env.KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: npm run build

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.present == 'true'
        with:
          driver: docker

      - name: Build the base image
        if: steps.creds.outputs.present == 'true'
        run: |
          RELEASE=2026.09.1 REVISION="$GITHUB_SHA" BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            docker buildx bake -f docker/docker-bake.hcl base --set 'base.tags=cc-workbench-ci:base-2026.09.1'

      - name: Workbench suite
        if: steps.creds.outputs.present == 'true'
        env:
          CC_E2E_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CC_E2E_BASE_IMAGE: cc-workbench-ci:base-2026.09.1
        run: xvfb-run -a node tests/e2e/workbench.mjs

      - name: Deep suite
        if: steps.creds.outputs.present == 'true'
        env:
          CC_E2E_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CC_E2E_BASE_IMAGE: cc-workbench-ci:base-2026.09.1
        run: xvfb-run -a node tests/e2e/deep.mjs

      - name: Live model suite
        if: steps.creds.outputs.present == 'true'
        env:
          CC_E2E_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CC_E2E_BASE_IMAGE: cc-workbench-ci:base-2026.09.1
        run: xvfb-run -a node tests/e2e/live.mjs

      - name: Report a missing credential
        if: steps.creds.outputs.present != 'true'
        run: |
          echo "::warning::OPENROUTER_API_KEY is not set; the live end-to-end suites were skipped."
